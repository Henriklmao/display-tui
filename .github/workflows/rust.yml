name: Rust

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Build release binary
      run: cargo build --release

    - name: Set build name
      id: build
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          name="$GITHUB_REF_NAME"
        else
          name="ci-${GITHUB_SHA::7}"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Package release binary
      run: |
        mkdir -p dist
        cp target/release/display-tui "dist/display-tui-${{ steps.build.outputs.name }}-x86_64-unknown-linux-gnu"

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: display-tui-${{ steps.build.outputs.name }}-x86_64-unknown-linux-gnu
        path: dist/display-tui-*-x86_64-unknown-linux-gnu

    - name: Upload binary to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: "dist/display-tui-*-x86_64-unknown-linux-gnu"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
