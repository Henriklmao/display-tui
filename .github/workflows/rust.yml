name: Rust

on:
  push:
  pull_request:

# A newer push/PR supersedes the previous run for the same ref.
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the release step widens it per job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    # Pinned on purpose: a new stable clippy can introduce a lint that fails
    # the `-D warnings` gate in a commit that was green before (clippy 1.99
    # added needless_borrows_for_generic_args). Bump this deliberately.
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.99.0"
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Format check
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Set build name
      id: build
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          name="$GITHUB_REF_NAME"
        else
          name="${GITHUB_SHA::7}"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Package release binary
      run: |
        mkdir -p dist
        cp target/release/display-tui "dist/display-tui-${{ steps.build.outputs.name }}-x86_64-linux-gnu"

    # Everything that is not a version release gets a downloadable binary named
    # after the commit (or tag).
    - name: Upload build artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: actions/upload-artifact@v6
      with:
        name: display-tui-${{ steps.build.outputs.name }}-x86_64-linux-gnu
        path: dist/display-tui-*-x86_64-linux-gnu

    # Only version tags attach the binary to the GitHub Release.
    - name: Upload binary to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: "dist/display-tui-*-x86_64-linux-gnu"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
